apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "bitplay-frontend.fullname" . }}-env
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  labels:
    {{- include "bitplay-frontend.labels" . | nindent 4 }}
spec:
  template:
    type: Opaque
    metadata:
      labels:
        {{- include "bitplay-frontend.labels" . | nindent 8 }}
  encryptedData:
    {{- toYaml .Values.encryptedEnvVars | nindent 4 }}
