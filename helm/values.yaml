envVars:
  JWT_ALG: HS512
  NEXT_PUBLIC_ENV: development
  NEXT_CASINO_SLUG: 'egcbitplay'
encryptedEnvVars:
  SECRET: 
  JWT_ENCRYPTION_KEY: 
  JWT_SECRET: 
  JWT_SIGNING_KEY: 

replicaCount: 1

image:
  repository: ''
  pullPolicy: Always
  tag: latest

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

podAnnotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 768Mi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
